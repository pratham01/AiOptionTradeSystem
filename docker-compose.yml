# ═══════════════════════════════════════════════════════════════
# Trade System v2 — Docker Compose Production Stack
# ═══════════════════════════════════════════════════════════════
#
# Quick start:
#   cp .env.example .env   # populate with your credentials
#   docker compose up -d --build
#   docker compose ps      # verify health
#   docker compose logs -f live-bot  # tail logs
#
# Stop:
#   docker compose down
#
# ═══════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────
  # Redis — Event bus for inter-agent communication
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trade_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - trade_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # Live Trading Bot — Main real-time trading engine
  # ─────────────────────────────────────────────────────────
  live-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade_bot_live
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: python scripts/run_live_trading.py
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - trade_data:/app/data
      - trade_logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - trade_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────
  # 15-Minute DB Sync — Historical data fetcher
  # ─────────────────────────────────────────────────────────
  sync-15m-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade_bot_sync_15m
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: python src/trade_system/interfaces/live/sync_15m_db.py
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - trade_data:/app/data
      - trade_logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - trade_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # ST Touch Scanner — Supertrend options scanner
  # ─────────────────────────────────────────────────────────
  st-touch-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade_bot_st_scanner
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: python scripts/run_live_st_scanner.py
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - trade_data:/app/data
      - trade_logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - trade_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────
  # Streamlit Dashboard — Mission Control web UI
  # ─────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade_bot_dashboard
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: >
      streamlit run src/trade_system/interfaces/dashboard/main.py
      --server.port 8502
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    ports:
      - "${DASHBOARD_PORT:-8502}:8502"
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - trade_data:/app/data
      - trade_logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - trade_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # Cron Tasks — EOD batch jobs (4:15 PM IST, Mon-Fri)
  # ─────────────────────────────────────────────────────────
  cron-tasks:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade_bot_cron
    restart: unless-stopped
    user: root
    command: >
      sh -c "echo '15 10 * * 1-5 cd /app && PYTHONPATH=src python scripts/run_post_market_swarm.py >> /proc/1/fd/1 2>&1' > /etc/cron.d/trade-cron &&
             chmod 0644 /etc/cron.d/trade-cron &&
             crontab /etc/cron.d/trade-cron &&
             cron -f"
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - trade_data:/app/data
      - trade_logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - trade_net

# ─────────────────────────────────────────────────────────────
# Named Volumes — Persistent data survives container rebuilds
# ─────────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  trade_data:
    driver: local
  trade_logs:
    driver: local

# ─────────────────────────────────────────────────────────────
# Network — Isolated bridge network for inter-service comms
# ─────────────────────────────────────────────────────────────
networks:
  trade_net:
    driver: bridge
