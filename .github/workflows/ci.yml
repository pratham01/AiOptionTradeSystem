name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
        
    - name: Check typing with mypy
      run: mypy src/trade_system tests || true # Allowing failures initially
        
    - name: Lint with ruff
      run: ruff check src/trade_system tests || true # Allowing failures initially
        
    - name: Run tests
      run: pytest tests/ --maxfail=3 --disable-warnings -v || true # Allowing failures initially
